name: fetch-cloud-images
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python fetch.py
      - run: |
          git config user.name "cloud-bot"
          git config user.email "bot@users.noreply.github.com"
          git add archived/
          git diff --cached --quiet || git commit -m "new images"
          git push
